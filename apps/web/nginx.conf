# SPA: serve index.html for any unmatched path, proxy /api to the API service.
# Long-poll on /api/dispatch/claim can hold up to 30s, so we extend proxy_read_timeout
# to avoid spurious 504s. The API service is named `api` in docker-compose.

upstream task_scheduler_api {
    server api:4100;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — cache aggressively (file names include content hashes).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy.
    location /api/ {
        proxy_pass http://task_scheduler_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 25m;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
